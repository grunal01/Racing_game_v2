<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop · shape the models</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d1a14;color:#fff;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100vw;height:100vh;outline:none}
.panel{position:fixed;background:rgba(22,18,12,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
#models{left:12px;top:12px;bottom:12px;width:220px;display:flex;flex-direction:column}
#models input{font:14px system-ui;background:#2a241a;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 7px;margin:6px 0}
#list{overflow:auto;flex:1}#list div{padding:2px 6px;border-radius:4px;cursor:pointer;font-size:13px}#list div:hover{background:rgba(255,255,255,.1)}#list div.on{background:#c8683a}
#list h5{margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.55}
#edit{right:12px;top:12px;bottom:12px;width:300px;overflow:auto}
h3{margin:0 0 4px;font-size:15px}h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.row{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:6px;margin:3px 0;font-size:13px}.row b{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button,.btn{font:13px system-ui;background:#3a3125;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 8px;cursor:pointer}
.chips button.on{background:#c8683a;border-color:#f0a070}.btn.main{background:#c8683a}.btn:hover,.chips button:hover{filter:brightness(1.2)}
#name{font:14px system-ui;background:#2a241a;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 7px;width:150px}
#saved div{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:13px}#saved span{cursor:pointer}#saved span:hover{text-decoration:underline}#saved small{opacity:.55;margin-left:4px}
#saved button{font:12px system-ui;background:none;border:none;color:#f99;cursor:pointer}
#info{left:50%;transform:translateX(-50%);bottom:12px;font-size:13px;text-align:center}
#back{left:50%;transform:translateX(-50%);top:12px;font-size:13px}#back a{color:#f6c36a}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#1d1a14}
.note{font-size:12px;opacity:.65;margin:4px 0}
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="loading">Loading models…</div>
<div id="models" class="panel"><h3>Models</h3><input id="search" placeholder="Search (rock, cactus, palm…)"><div id="list"></div></div>
<div id="edit" class="panel"></div>
<div id="info" class="panel"></div>
<div id="back" class="panel">Workshop · drag to orbit, right-drag to pan, wheel to zoom · <a href="index.html">back to the game</a></div>
<script src="vendor/three-bundle.js"></script>
<script src="vendor/gltf-loader.js"></script>
<script src="vendor/rapier.js"></script>
<script src="js/assets.js"></script>
<script src="js/assets.loader.js"></script>
<script src="js/workshop.js"></script>
</body>
</html>
